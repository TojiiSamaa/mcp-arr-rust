name: GHCR publication (main)

# Apres des tests verts sur main : image `:sha-<commit>` et `:prod` sur GHCR. C'est ce `:prod` que le script
# pull de l'hote (deploy/, en sortant) tire. La publication par tag v*.*.* reste dans release-arr.yml.
# Aucune action ici ne touche a la prod : l'hote tire, rien n'est pousse vers lui.

on:
  workflow_run:
    workflows: ["Test CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ghcr-publication-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish :sha and :prod
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # linux/amd64 seul (hote x86) ; l'arm64 reste fourni par release-arr.yml sur tag.
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ steps.meta.outputs.image }}:prod
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=main
          cache-to: type=gha,scope=main,mode=max
