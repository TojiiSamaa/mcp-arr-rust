name: Release arrmcp

# Une chaîne : image GHCR (linux/amd64 + arm64) -> GitHub Release, dans la même exécution.
#   Push du tag `vX.Y.Z`  -> construit ce tag.
#   Lancement manuel      -> `gh workflow run release-arr.yml -f version=X.Y.Z` construit le commit courant et crée le tag.
# `version` doit égaler celle de Cargo.toml ; les notes sont la section `## [X.Y.Z]` de CHANGELOG.md (absente = échec).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, ex. 1.0.0 (défaut : celle de Cargo.toml)"
        required: false

permissions:
  contents: read

concurrency:
  group: release-arr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Les mêmes contrôles que Test CI (format, clippy, tests, preuves A/B, audit, contrat) ; un échec bloque tout.
  # test-ci.yml contient le job `fusion-auto` (contents + pull-requests: write, jamais exécuté ici) : un workflow appelé
  # ne peut pas dépasser les droits de l'appelant, sans ces deux lignes l'appel est refusé au démarrage. Les autres
  # jobs restent en `contents: read` (droit par défaut de test-ci.yml).
  checks:
    name: Checks
    uses: ./.github/workflows/test-ci.yml
    permissions:
      contents: write
      pull-requests: write

  # Porte de sécurité : pas de release avec une CRITICAL/HIGH corrigeable dans l image (Trivy).
  securite-image:
    name: Securite image
    uses: ./.github/workflows/securite-image.yml
    permissions:
      contents: read
      security-events: write

  prepare:
    name: Resolve version and notes
    needs: [checks, securite-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      image: ${{ steps.v.outputs.image }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${REF_TYPE}" = "tag" ]; then version="${REF_NAME#v}"; else version="${INPUT:-${cargo_version}}"; version="${version#v}"; fi
          if [ "${version}" != "${cargo_version}" ]; then
            echo "::error::version ${version} differs from Cargo.toml (${cargo_version}); bump Cargo.toml first"; exit 1
          fi
          sed -n "/^## \[${version}\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d' | sed '/^\[.*\]: http/d' > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"; exit 1
          fi
          case "${version}" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=${version}"
            echo "prerelease=${pre}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=arrmcp
            org.opencontainers.image.description=MCP server for Sonarr, Radarr, Lidarr, Prowlarr and Tracearr (Rust): read, guarded write
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  package:
    name: Multi-arch manifest (GHCR)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          major_minor="${VERSION%.*}"; major="${VERSION%%.*}"
          tags=(--tag "${IMAGE}:${VERSION}")
          if [ "${PRERELEASE}" = "false" ]; then tags+=(--tag "${IMAGE}:latest" --tag "${IMAGE}:${major_minor}" --tag "${IMAGE}:${major}"); fi
          sources=(); for f in *; do sources+=("${IMAGE}@sha256:${f}"); done
          # L'annotation `source` de l'index relie le paquet à ce dépôt sur GitHub.
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=${SOURCE}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  release:
    name: GitHub Release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Create the release (no binary attached; the tag is created on this commit if absent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d' | sed '/^\[.*\]: http/d' > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"; exit 1
          fi
          cat changes.md > notes.md
          cat >> notes.md <<EOF

          ## Docker image

          \`\`\`
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Multi-arch (linux/amd64, linux/arm64). Over HTTP it needs \`ARR_MCP_TOKEN\`; writes stay off unless \`ARR_ALLOW_WRITES=true\`. See the README.
          EOF
          flags=(--title "v${VERSION}" --notes-file notes.md)
          [ "${PRERELEASE}" = "true" ] && flags+=(--prerelease)
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists, nothing to do."
          else
            gh release create "v${VERSION}" --target "${GITHUB_SHA}" "${flags[@]}"
          fi
