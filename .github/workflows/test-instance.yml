name: Test instance

# Niveau instance jetable (Sonarr, Radarr, Lidarr, Prowlarr aux versions épinglées dans scripts/ci/instance.sh).
# Pas à chaque PR : à la main et chaque semaine. Aucun secret : la clé d'API est aléatoire et locale au job.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: test-instance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instance:
    name: Disposable instances, read tools replayed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: scripts/ci/build-release.sh
      - run: scripts/ci/instance.sh
